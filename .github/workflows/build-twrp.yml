name: Build TWRP Itel S25 (tssi)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "Branch minimal manifest TWRP (twrp-11 / twrp-12.1)"
        required: true
        default: "twrp-11"
      DEVICE_TREE:
        description: "URL device tree"
        required: true
        default: "https://github.com/ganendra4u/android_device_itel_S685LN"
      DEVICE_BRANCH:
        description: "Branch device tree"
        required: true
        default: "recovery"
      DEVICE_PATH:
        description: "Path tujuan di source"
        required: true
        default: "device/itel/tssi"
      LUNCH:
        description: "Target lunch (omni_tssi-eng untuk twrp-11, twrp_tssi-eng untuk twrp-12.1)"
        required: true
        default: "omni_tssi-eng"
      BUILD_TARGET:
        description: "Target build (recoveryimage / bootimage / vendorbootimage)"
        required: true
        default: "recoveryimage"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 rsync bc ccache lz4 cpio openjdk-11-jdk \
            libssl-dev ca-certificates

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Sync TWRP minimal manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ inputs.MANIFEST_BRANCH }}
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone device tree
        run: |
          cd ~/twrp
          git clone --depth=1 -b ${{ inputs.DEVICE_BRANCH }} ${{ inputs.DEVICE_TREE }} ${{ inputs.DEVICE_PATH }}
          ls -la ${{ inputs.DEVICE_PATH }}

      - name: Build TWRP
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch ${{ inputs.LUNCH }}
          mka ${{ inputs.BUILD_TARGET }} -j$(nproc --all)

      - name: Collect output
        run: |
          mkdir -p ~/out
          cd ~/twrp/out/target/product/*/
          cp -v recovery.img boot.img vendor_boot.img ~/out/ 2>/dev/null || true
          ls -lh ~/out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-itel-tssi-${{ github.run_number }}
          path: ~/out/*.img
          if-no-files-found: error
