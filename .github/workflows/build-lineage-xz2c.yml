name: Build LineageOS 17.1 (Sony XZ2 Compact)

on:
  workflow_dispatch:
    inputs:
      LUNCH:
        description: "Target lunch"
        required: true
        default: "lineage_xz2c-userdebug"
      ROM_TARGET:
        description: "Target make"
        required: true
        default: "bacon"
      JOBS:
        description: "Jumlah job paralel (tanpa swap, turunkan kalau kena OOM)"
        required: true
        default: "5"
      BUILD_TIMEOUT_MIN:
        description: "Batas waktu build (menit)"
        required: true
        default: "600"
      CLEAN_CCACHE:
        description: "Hapus ccache lama? (true/false)"
        required: true
        default: "false"
      SLIM_SOURCE:
        description: "Hemat disk: hapus .repo objects dan prebuilts darwin/windows (true/false)"
        required: true
        default: "true"

env:
  ROM_DIR: ${{ github.workspace }}/rom
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_SIZE: 4G

jobs:
  build:
    # Ganti "default" dengan nama profile yang kamu buat di Namespace
    runs-on: namespace-profile-masbudiganteng
    timeout-minutes: 720

    steps:
      - name: Show disk
        run: |
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 libtinfo5 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python2 python3 rsync bc ccache lz4 cpio libssl-dev \
            schedtool squashfs-tools pngcrush lzop ca-certificates
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          sudo apt-get clean

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Restore ccache
        if: ${{ inputs.CLEAN_CCACHE != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-xz2c-${{ github.run_id }}
          restore-keys: |
            ccache-xz2c-

      - name: Sync LineageOS source
        run: |
          mkdir -p $ROM_DIR && cd $ROM_DIR
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          for i in 1 2 3; do
            repo sync -c -j8 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune && break
            echo "Sync gagal, coba lagi ($i)"; sleep 10
          done
          df -h .

      - name: Clone device, kernel, vendor
        run: |
          cd $ROM_DIR
          git clone --depth=1 https://github.com/LineageOS/android_kernel_sony_sdm845 -b lineage-17.1 kernel/sony/sdm845
          git clone --depth=1 https://github.com/LineageOS/android_device_sony_xz2c -b lineage-17.1 device/sony/xz2c
          git clone --depth=1 https://github.com/ganendra4u/android_device_sony_tama-common -b lineage-17.1 device/sony/tama-common
          git clone --depth=1 https://github.com/LineageOS/android_hardware_sony_SonyOpenTelephony -b lineage-17.1 hardware/sony/SonyOpenTelephony
          git clone --depth=1 https://github.com/ganendra4u/proprietary_vendor_sony_apollo -b lineage-17.1 vendor/sony/xz2c
          git clone --depth=1 https://github.com/ganendra4u/proprietary_vendor_sony_tama-common -b lineage-17.1 vendor/sony/tama-common
          df -h .

      - name: Slim source and move to cache volume
        if: ${{ inputs.SLIM_SOURCE == 'true' }}
        run: |
          cd $ROM_DIR
          df -h / /cache
          # Objek git repo (tidak dibutuhkan saat build)
          rm -rf .repo/project-objects .repo/projects
          # Prebuilts untuk macOS/Windows (build ini di Linux)
          for d in prebuilts/*/darwin-x86* prebuilts/*/*/darwin-x86* prebuilts/*/*/*/darwin-x86* \
                   prebuilts/*/windows-x86* prebuilts/*/*/windows-x86* prebuilts/*/*/*/windows-x86*; do
            [ -d "$d" ] && rm -rf "$d"
          done
          du -sh $ROM_DIR
          df -h / /cache

          # Pindahkan source ke volume /cache, supaya root (95G) dipakai penuh untuk folder out
          sudo mkdir -p /cache/rom
          sudo chown -R $(id -u):$(id -g) /cache/rom
          rsync -a --delete $ROM_DIR/ /cache/rom/
          rm -rf $ROM_DIR
          echo "ROM_DIR=/cache/rom" >> $GITHUB_ENV
          df -h / /cache

      - name: Build ROM
        id: build
        continue-on-error: true
        run: |
          cd $ROM_DIR
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=$(command -v ccache)
          export CCACHE_COMPRESS=1

          # Folder out di root (volume besar), source di /cache
          export OUT_DIR_COMMON_BASE=${{ github.workspace }}/outbase
          mkdir -p $OUT_DIR_COMMON_BASE

          # Folder temp ke root

          export TMPDIR=${{ github.workspace }}/tmp
          export CCACHE_TEMPDIR=${{ github.workspace }}/tmp/ccache
          mkdir -p $TMPDIR $CCACHE_TEMPDIR $CCACHE_DIR

          ccache -M $CCACHE_SIZE
          ccache -s

          # Pemantau disk dan RAM tiap 10 menit
          (
            while true; do
              echo "----- MONITOR $(date +%H:%M) -----"
              df -h / /cache | sed -n '1,4p'
              free -m | sed -n '1,3p'
              sleep 600
            done
          ) &
          MON_PID=$!

          echo 1000 > /proc/$$/oom_score_adj 2>/dev/null || true
          set +e
          timeout ${{ inputs.BUILD_TIMEOUT_MIN }}m bash -c "
            source build/envsetup.sh &&
            lunch ${{ inputs.LUNCH }} &&
            mka ${{ inputs.ROM_TARGET }} -j${{ inputs.JOBS }}
          " 2>&1 | tee ${{ github.workspace }}/build.log
          code=${PIPESTATUS[0]}
          kill $MON_PID 2>/dev/null

          echo "===== Cek penyebab (disk / OOM) ====="
          grep -n -i -m5 -E "No space left|Killed|out of memory|bad_alloc|Cannot allocate memory" ${{ github.workspace }}/build.log
          sudo dmesg 2>/dev/null | grep -i -E "out of memory|killed process" | tail -5
          df -h / /cache

          if [ $code -eq 124 ]; then
            echo "TIMEOUT: build belum selesai, jalankan workflow lagi (ccache dilanjutkan)."
          elif [ $code -ne 0 ]; then
            echo "===== ERROR (FAILED:) ====="
            grep -n -B2 -A30 -m3 -E "FAILED:|error:|Error " ${{ github.workspace }}/build.log | head -120
          fi
          ccache -s
          exit $code

      - name: Check output
        id: out
        if: always()
        run: |
          if ls ${{ github.workspace }}/outbase/rom/target/product/*/*.zip >/dev/null 2>&1; then
            ls -lh ${{ github.workspace }}/outbase/rom/target/product/*/*.zip
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload ROM
        if: always() && steps.out.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lineage-xz2c-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/outbase/rom/target/product/*/lineage-*.zip
            ${{ github.workspace }}/outbase/rom/target/product/*/boot.img
          if-no-files-found: warn

      - name: Disk usage report
        if: always()
        run: |
          df -h / /cache
          du -h --max-depth=1 ${{ github.workspace }}/outbase/rom 2>/dev/null | sort -h | tail -8

      - name: Free space before cache save
        if: always()
        run: |
          # Hanya ccache yang disimpan, jadi folder out boleh dihapus
          sudo rm -rf ${{ github.workspace }}/outbase
          sudo rm -rf ${{ github.workspace }}/tmp
          df -h / /cache

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-xz2c-${{ github.run_id }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: ${{ github.workspace }}/build.log
          if-no-files-found: ignore
          retention-days: 3
