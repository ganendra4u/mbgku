name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: reygasta/kernel-ginkgo-droidspaces
          submodules: recursive

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make git python3 bc flex bison ccache \
            libelf-dev dwarves openssl libssl-dev perl zstd binutils libncurses-dev zip rsync

      - name: Setup clang toolchain
        run: |
          mkdir -p toolchains
          rm -rf toolchains/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchains/clang

      - name: Fill missing files from matching upstream branch
        run: |
          U=https://github.com/FlopKernel-Series/flop_trinket-mi_kernel
          git clone --filter=blob:none --no-checkout $U /tmp/probe
          cd /tmp/probe
          best=""; bestdiff=9999
          mine=$(grep -E '^SUBLEVEL' /home/runner/work/*/*/kernel/Makefile | head -1 | grep -oE '[0-9]+')
          for b in $(git branch -r | grep -v HEAD | sed 's/ *origin\///'); do
            if git cat-file -e origin/$b:arch/arm64/kernel/vdso/gettimeofday.S 2>/dev/null; then
              v=$(git show origin/$b:Makefile | grep -E '^SUBLEVEL' | grep -oE '[0-9]+')
              d=$(( v > mine ? v - mine : mine - v ))
              if [ $d -lt $bestdiff ]; then bestdiff=$d; best=$b; fi
            fi
          done
          echo "Branch terpilih: $best (selisih SUBLEVEL: $bestdiff)"
          [ -n "$best" ] || { echo "Tidak ada branch cocok"; exit 1; }
          git clone --depth 1 -b "$best" $U /tmp/upstream
          cd $GITHUB_WORKSPACE
          rsync -a --ignore-existing --exclude=.git /tmp/upstream/ kernel/

      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh defconfig
          ./build.sh build

      - name: Create flashable ZIP
        run: |
          mkdir -p AnyKernel3/kernel
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/kernel/
          cd AnyKernel3
          zip -r ../Floppy_custom-ginkgo.zip . -x "*.git*"

      - uses: actions/upload-artifact@v4
        with:
          name: Floppy_custom-ginkgo
          path: Floppy_custom-ginkgo.zip
